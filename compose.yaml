services:
  app:
    image: ghcr.io/tomyjan/nailist:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?请在 .env 中设置外部 PostgreSQL 连接串}
      PORT: ${PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      PUBLIC_URL: ${PUBLIC_URL:?请在 .env 中设置站点 HTTPS 根地址}
      UMAMI_SCRIPT_URL: ${UMAMI_SCRIPT_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      UMAMI_SHARE_URL: ${UMAMI_SHARE_URL:-}
      QQ_APP_ID: ${QQ_APP_ID:-}
      QQ_APP_KEY: ${QQ_APP_KEY:-}
      QQ_USE_UNIONID: ${QQ_USE_UNIONID:-false}
      OIDC_ID: ${OIDC_ID:-}
      OIDC_NAME: ${OIDC_NAME:-}
      OIDC_ICON: ${OIDC_ICON:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
