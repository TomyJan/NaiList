version: 2
updates:
  # Dependabot 使用 npm 生态配置管理 pnpm-lock.yaml。
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: daily
    groups:
      react-runtime:
        patterns:
          - react
          - react-dom
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
