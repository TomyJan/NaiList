name: Build and Check

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Archive version; defaults to dev-<commit>
        type: string
        required: false
        default: ""
      ref:
        description: Commit to build and test
        type: string
        required: false
        default: ""
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go checks and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nailist
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: nailist
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nailist -d nailist"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://nailist:ci-test-password@localhost:5432/nailist?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Format and vet
        run: |
          test -z "$(gofmt -l cmd internal migrations)"
          go vet ./...
      - name: Workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= .github/workflows/*.yml
      - name: Tests including database integration
        run: go test -race -count=1 ./...
      - name: Build backend
        run: go build ./cmd/server

  frontend:
    name: TypeScript checks, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format and typecheck
        run: |
          pnpm exec prettier --check src e2e '*.ts' package.json tsconfig.json index.html
          pnpm exec tsc --noEmit
      - name: Release version tests
        run: node --test ../scripts/*.test.mjs
      - run: pnpm test
      - run: pnpm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  e2e:
    name: Light and dark browser tests
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nailist
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: nailist
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nailist -d nailist"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://nailist:ci-test-password@localhost:5432/nailist?sslmode=disable
      PUBLIC_URL: http://127.0.0.1:8080
      LISTEN_ADDR: 127.0.0.1:8080
      TEST_APP_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chrome
        working-directory: web
      - name: Start backend and run browser tests
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/nailist" ./cmd/server
          "$RUNNER_TEMP/nailist" > server.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent "$PUBLIC_URL/api/health" > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat server.log; exit 1; fi
          pnpm --dir web run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: |
            web/test-results
            server.log
          retention-days: 7

  binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [linux]
        goarch: [amd64]
        # 恢复其他平台时使用以下矩阵：
        # goos: [linux, darwin, windows]
        # goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: Build and package application
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ inputs.version || format('dev-{0}', github.sha) }}
        shell: bash
        run: |
          mkdir -p bundle/web
          binary=nailist
          if [ "$GOOS" = windows ]; then binary=nailist.exe; fi
          go build -trimpath -ldflags='-s -w' -o "bundle/$binary" ./cmd/server
          cp -R web/dist bundle/web/dist
          cp README.md LICENSE .env.example bundle/
          cp web/ASSETS.md bundle/web/
          archive="nailist-$VERSION-$GOOS-$GOARCH"
          if [ "$GOOS" = windows ]; then
            (cd bundle && zip -qr "../$archive.zip" .)
          else
            tar -czf "$archive.tar.gz" -C bundle .
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            nailist-*.tar.gz
            nailist-*.zip
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker build
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Validate deployment configuration
        env:
          POSTGRES_PASSWORD: ci-test-password
          PUBLIC_URL: https://groups.example.com
        run: docker compose config --quiet
      - name: Build container
        run: docker build --tag nailist:ci .
